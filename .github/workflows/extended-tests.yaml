name: extended-tests

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:
    inputs:
      run_validation_smoke:
        description: "Run the Phase 9 V0 validation smoke job"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  issues: write

concurrency:
  group: extended-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  NOT_CRAN: "true"
  TZ: "UTC"
  MULTISITEDGP_RUN_SLOW: "true"
  MULTISITEDGP_RUN_PROPERTY: "true"
  MULTISITEDGP_RUN_VALIDATION: "false"
  MULTISITEDGP_REPRODUCIBILITY_POLICY: "portable-hash-v3"
  MULTISITEDGP_ALLOW_NON_LINUX_PRINT_REGEN: "false"

jobs:
  extended-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::knitr
            any::rmarkdown
            any::sn
            any::LaplacesDemon
            any::moments
          install-quarto: false

      - name: Install package
        run: R CMD INSTALL .
        shell: bash

      - name: Run slow and property tests
        run: testthat::test_local(".", reporter = "summary")
        shell: Rscript {0}

      - name: Run validation smoke
        if: ${{ github.event_name == 'schedule' || inputs.run_validation_smoke == 'true' }}
        env:
          MULTISITEDGP_VALIDATION_RUN_ID: ci-v0-smoke
          MULTISITEDGP_VALIDATION_MODE: smoke
          MULTISITEDGP_VALIDATION_REPS: "3"
          MULTISITEDGP_VALIDATION_OVERWRITE: "true"
        run: Rscript tools/validation/jobs/run-v0-smoke-validation.R
        shell: bash


      - name: Open an issue when the scheduled run fails
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'extended-tests failing on the weekly schedule';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const body = [
              `The weekly \`extended-tests\` run failed: ${url}`,
              '',
              'This issue exists because a scheduled failure has no other',
              'audience. In 2026 this job failed ten weeks running and nobody',
              'was told, and GitHub then disabled it for inactivity, so even',
              'the red signal stopped.',
              '',
              'It closes itself on the next successful scheduled run.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure',
            });
            if (existing.data.some(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data.find(i => i.title === title).number,
                body: `Still failing: ${url}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-failure'],
              });
            }

      - name: Close the failure issue when the schedule goes green
        if: ${{ success() && github.event_name == 'schedule' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'extended-tests failing on the weekly schedule';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure',
            });
            for (const issue of open.data.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: `Green again: ${url}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: extended-validation-generated
          path: tools/validation/generated
          if-no-files-found: ignore
          retention-days: 30
